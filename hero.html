  <style>
    /* ─── AAA HERO 3-PANEL RADIANT GRID ───────────────────────────────────── */
    .hero-3panel-grid {
      display: grid;
      grid-template-columns: 310px 410px 1fr;
      gap: 1.5rem;
      align-items: start;
      margin-top: 1.5rem;
      margin-bottom: 4rem;
    }

    /* Panel 1: Profile Card */
    .panel-hero-profile {
      background: var(--bg-card);
      backdrop-filter: blur(20px);
      border: 1px solid var(--border-glass-bright);
      border-radius: var(--radius-lg);
      padding: 1.5rem;
      display: flex;
      flex-direction: column;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6);
      position: sticky;
      top: 75px;
    }

    .panel-hero-avatar {
      width: 100%;
      height: 310px;
      border-radius: var(--radius-md);
      overflow: hidden;
      border: 2px solid var(--border-glass);
      margin-bottom: 1.25rem;
      background: #000;
      position: relative;
      transition: all 0.3s ease;
    }

    .panel-hero-avatar img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: top center;
    }

    .panel-hero-avatar.rarity-sp {
      border-color: #ef4444;
      box-shadow: 0 0 30px rgba(239, 68, 68, 0.5), 0 0 60px rgba(168, 85, 247, 0.3);
      animation: auraPulsing 3s infinite ease-in-out;
    }

    .panel-hero-avatar.rarity-ssr {
      border-color: var(--accent-gold);
      box-shadow: 0 0 25px rgba(251, 191, 36, 0.45);
    }

    @keyframes auraPulsing {
      0%, 100% { box-shadow: 0 0 25px rgba(239, 68, 68, 0.4), 0 0 50px rgba(168, 85, 247, 0.2); }
      50% { box-shadow: 0 0 45px rgba(239, 68, 68, 0.7), 0 0 80px rgba(168, 85, 247, 0.45); }
    }

    /* Panel 2: Radial HUD & Skill List */
    .panel-skills-list {
      background: var(--bg-card);
      backdrop-filter: blur(20px);
      border: 1px solid var(--border-glass-bright);
      border-radius: var(--radius-lg);
      padding: 1.5rem;
      display: flex;
      flex-direction: column;
      gap: 1.25rem;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6);
    }

    /* Enhanced Holographic Radial Wheel */
    .radial-menu-wrapper {
      position: relative;
      width: 330px;
      height: 330px;
      margin: 0 auto;
      background: radial-gradient(circle, rgba(6, 182, 212, 0.18) 0%, rgba(18, 26, 43, 0.95) 70%);
      border-radius: 50%;
      border: 1.5px solid var(--border-glass-bright);
      box-shadow: 0 0 50px rgba(0, 0, 0, 0.9), inset 0 0 25px rgba(6, 182, 212, 0.2);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .radial-orbital-svg {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      animation: rotateOrbit 30s linear infinite;
    }

    @keyframes rotateOrbit {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    .radial-node {
      position: absolute;
      border-radius: 50%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
      background: #0d1527;
      border: 2px solid var(--border-glass);
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.7);
      user-select: none;
      z-index: 10;
    }

    .radial-node:hover {
      transform: scale(1.15);
      border-color: var(--accent-cyan);
      box-shadow: 0 0 28px rgba(6, 182, 212, 0.7);
    }

    .radial-node.active {
      border-color: var(--accent-cyan);
      background: linear-gradient(135deg, rgba(6, 182, 212, 0.45), rgba(59, 130, 246, 0.45));
      box-shadow: 0 0 35px rgba(6, 182, 212, 0.9), inset 0 0 15px rgba(6, 182, 212, 0.6);
      transform: scale(1.08);
    }

    .radial-node-center {
      width: 98px;
      height: 98px;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      z-index: 15;
      background: radial-gradient(circle, rgba(6, 182, 212, 0.5) 0%, rgba(13, 21, 39, 0.98) 100%);
      border: 2.5px solid var(--accent-cyan);
      box-shadow: 0 0 35px rgba(6, 182, 212, 0.7);
    }

    .radial-node-center:hover { transform: translate(-50%, -50%) scale(1.12); }
    .radial-node-center.active { transform: translate(-50%, -50%) scale(1.08); }

    .radial-node-tl { top: 8%; left: 8%; width: 76px; height: 76px; }
    .radial-node-tr { top: 8%; right: 8%; width: 76px; height: 76px; }
    .radial-node-bl { bottom: 8%; left: 8%; width: 76px; height: 76px; }
    .radial-node-br { bottom: 8%; right: 8%; width: 76px; height: 76px; }

    .node-icon { font-size: 1.5rem; line-height: 1; }
    .radial-node-center .node-icon { font-size: 2.1rem; }
    .node-label { font-size: 0.72rem; font-weight: 800; color: #fff; margin-top: 0.2rem; white-space: nowrap; }
    .radial-node-center .node-label { font-size: 0.82rem; color: #a5f3fc; }

    /* Branch Switcher Container */
    .branch-toggle-container {
      display: flex;
      gap: 0.4rem;
      background: rgba(6, 9, 19, 0.75);
      padding: 0.35rem;
      border-radius: var(--radius-md);
      border: 1px solid var(--border-glass-bright);
    }

    .branch-toggle-btn {
      flex: 1;
      padding: 0.65rem 0.75rem;
      border-radius: var(--radius-sm);
      font-size: 0.82rem;
      font-weight: 800;
      color: var(--text-sub);
      text-align: center;
      transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .branch-toggle-btn.active {
      background: linear-gradient(135deg, rgba(251, 191, 36, 0.35), rgba(217, 119, 6, 0.35));
      border: 1px solid var(--accent-gold);
      color: #fef08a;
      box-shadow: 0 0 18px rgba(251, 191, 36, 0.4);
    }

    /* Skill Items Under Radial */
    .skill-list-item {
      background: rgba(18, 26, 43, 0.65);
      border: 1px solid var(--border-glass);
      padding: 0.85rem 1rem;
      border-radius: var(--radius-md);
      display: flex;
      align-items: center;
      gap: 1rem;
      cursor: pointer;
      transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .skill-list-item:hover, .skill-list-item.active {
      background: rgba(59, 130, 246, 0.22);
      border-color: var(--primary);
      box-shadow: 0 0 20px var(--primary-glow);
      transform: translateX(5px);
    }

    /* Panel 3: Display Panel */
    .panel-skill-display {
      background: var(--bg-card);
      backdrop-filter: blur(20px);
      border: 1px solid var(--border-glass-bright);
      border-radius: var(--radius-lg);
      padding: 1.75rem;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6);
      min-height: 540px;
    }

    @media (max-width: 1080px) {
      .hero-3panel-grid {
        grid-template-columns: 1fr;
      }
      .panel-hero-profile {
        position: static;
      }
    }
